name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Known vulnerabilities in what ships with the app (not the build tools).
      - run: npm audit --omit=dev
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  # Builds the real desktop app and runs its self-check under the production security policy. Required since
  # 2026-11-28 (it had passed on the last twelve pushes).
  desktop-selftest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --debug --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Run the app's self-check
        run: |
          SOULFORGE_SELFTEST="$RUNNER_TEMP/report.json" src-tauri/target/debug/bundle/macos/SoulForge.app/Contents/MacOS/charforge &
          for i in $(seq 1 40); do [ -f "$RUNNER_TEMP/report.json" ] && break; sleep 3; done
          cat "$RUNNER_TEMP/report.json"
          python3 -c "import json,sys; d=json.load(open('$RUNNER_TEMP/report.json')); sys.exit(0 if d['ok'] else 1)"
